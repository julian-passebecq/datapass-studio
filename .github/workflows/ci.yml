name: Studio public gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the reviewed dependency lock
        run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: node tools/standalone.mjs
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests/python -q
      - run: python -m playwright install --with-deps chromium
      - name: Isolated portable UI gate
        run: python tests/browser/run.py --html dist/studio-offline.html
      - name: Production HTTP integration and IndexedDB durability gate
        run: |
          python tools/serve.py --directory dist --port 8765 > qa/server.log 2>&1 &
          python -c "import time,urllib.request; time.sleep(3); assert urllib.request.urlopen('http://127.0.0.1:8765/api/health').status==200"
          python tools/smoke_http.py > qa/http-api-report.json
          python tests/browser/run.py --url http://127.0.0.1:8765
          python tests/browser/durability.py --url http://127.0.0.1:8765
      - name: Preserve public QA and resolved lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-public-gate
          path: |
            qa/browser-report.json
            qa/http-api-report.json
            qa/durability-report.json
            qa/screenshots/public-*.png
            qa/server.log
            package-lock.json
          retention-days: 7
