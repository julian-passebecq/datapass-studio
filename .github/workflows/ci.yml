name: Studio public gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve dependencies (switch to frozen npm ci after reviewed lock is committed)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: node tools/check-boundaries.mjs
      - run: node tools/export-schemas.mjs --check
      - run: npm run build
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests/python -q
      - run: python -m playwright install --with-deps chromium
      - name: Production HTTP integration gate
        run: |
          mkdir -p qa
          python tools/serve.py --api --directory dist --port 8765 > qa/server.log 2>&1 &
          python -c "import time, urllib.request; time.sleep(3); assert urllib.request.urlopen('http://127.0.0.1:8765/api/health').status == 200"
          python tests/browser/run.py --url http://127.0.0.1:8765
      - name: Keep public QA and generated dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-public-gate
          path: |
            qa/browser-report.json
            qa/screenshots/public-*.png
            qa/server.log
            package-lock.json
          retention-days: 7
